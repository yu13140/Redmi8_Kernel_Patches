name: Build Zloader Module

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:focal
    env:
      PAT: ${{ secrets.ACCESS_TOKEN }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Git Config
      shell: bash
      run: |
        apt-get update
        apt-get install git wget curl software-properties-common -y
        git config --global user.email "whmyc801@gmail.com"
        git config --global user.name "yu13140"
        
    - name: Clone Project
      shell: bash
      run: |     
        git clone -b 0413 https://${PAT}@github.com/yu13140/K-zloader.git kz
        cd kz

        wget https://apt.llvm.org/llvm-snapshot.gpg.key
        mv llvm-snapshot.gpg.key /etc/apt/trusted.gpg.d/
        add-apt-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-12 main"
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
        apt-get update
        apt-get install -y lld llvm-12-dev libclang-12-dev clang-12

        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
        rustup override set nightly
        rustup component add rust-src
        rustup target add aarch64-linux-android
        cargo install cargo-bpf
        cargo xbuild --release