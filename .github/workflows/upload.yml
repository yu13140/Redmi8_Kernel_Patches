name: Rollback And Upload To Repository

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PAT: ${{ secrets.ACCESS_TOKEN }}      
      GITHUB_WORKSPACE: /home/runner/work/Redmi8_Kernel_Patches/Redmi8_Kernel_Patches    

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Git Config
      run: |
        git config --global user.email "whmyc801@gmail.com"
        git config --global user.name "yu13140"
        
    - name: Commit to Repository
      run: |        
        git clone -b Cleanup https://${PAT}@github.com/yu13140/android_kernel_xiaomi_sdm439-4.19.git device_kernel
        cd device_kernel
        git branch manual ff7fe997c7d00a016a12ff1fac4d855d52eeea440
        git checkout manual
        git submodule deinit KernelSU-Next || true
        git rm --cached KernelSU-Next || true
        git add .
        git commit -m "Update files $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git push -f -u origin manual